version: 2

# No `before: hooks: [go mod tidy]`: it runs after the dirty-tree check, so it
# could only stamp the binary `+dirty`. `go mod tidy -diff` in CI covers it.

builds:
  - env:
      - CGO_ENABLED=0
    main: .
    # Without -trimpath the same commit builds differently on two machines.
    flags:
      - -trimpath
    # `main.injected`, not `main.version`; a `-X` naming a variable that does
    # not exist is dropped silently, so TestLdflagsVariableMatchesGoreleaser
    # holds this line to main.go (#40).
    ldflags:
      - -s -w -X main.injected={{.Version}}
    # Artefact mtimes from the commit, not from when the job ran.
    mod_timestamp: '{{ .CommitTimestamp }}'
    # The whole cross product, no `ignore:` block: an undocumented
    # windows/arm64 exclusion left those users emulating amd64, which for a CPU
    # stress tool makes the numbers meaningless (#28).
    # TestReleaseMatrixIsComplete fails if either list stops naming it all.
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  # `formats`, not the `format` singular deprecated in goreleaser v2.6.
  - formats: [binary]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

# The `{{ if not .Prerelease }}` guards below are the only thing keeping an
# `-rc` tag off `:latest`; goreleaser skips a template that renders empty.
dockers:
  - image_templates:
      - "ghcr.io/felipeneuwald/stressy:{{ .Version }}-amd64"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-amd64{{ end }}"
    use: buildx
    goarch: amd64
    goos: linux
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    dockerfile: Dockerfile
    # Staged into the build context for the Dockerfile's `COPY LICENSE`.
    extra_files:
      - LICENSE
  - image_templates:
      - "ghcr.io/felipeneuwald/stressy:{{ .Version }}-arm64"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-arm64{{ end }}"
    use: buildx
    goarch: arm64
    goos: linux
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    dockerfile: Dockerfile
    extra_files:
      - LICENSE

docker_manifests:
  - name_template: ghcr.io/felipeneuwald/stressy:{{ .Version }}
    image_templates:
      - ghcr.io/felipeneuwald/stressy:{{ .Version }}-amd64
      - ghcr.io/felipeneuwald/stressy:{{ .Version }}-arm64
  - name_template: "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest{{ end }}"
    image_templates:
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-amd64{{ end }}"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-arm64{{ end }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^refactor:'
      - Merge pull request
      - Merge branch

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Publish to GitHub
release:
  github:
    owner: felipeneuwald
    name: stressy
  # Keeps an rc tag off the "Latest" release, as the image guards do for :latest.
  prerelease: auto
  # No archive to carry the licence, so MIT needs it as its own release asset.
  extra_files:
    - glob: LICENSE

version: 2

updates:
  # go.mod / go.sum, indirect dependencies included.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Majors are left out on purpose: a breaking bump should fail on its own.
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The `uses:` refs in .github/workflows/, and only those: a step's inputs —
  # the inlined go-version, the goreleaser version, the @v2.12.2 — have no updater.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Grouped with majors included; a SHA pin has no other updater.
    groups:
      github-actions:
        patterns:
          - "*"
    # Matched by the anchored `^ci:` exclude in .goreleaser.yaml. Do not add
    # `include: scope`: `ci(deps):` no longer matches and the filter dies.
    commit-message:
      prefix: ci

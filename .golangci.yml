version: "2"

# Owns formatting as well as linting, so CI has one Go gate rather than a
# hand-rolled `gofmt -l` step alongside it. `golangci-lint fmt --diff` must run
# before `run`: `run` also reports "File is not properly formatted", but with no
# patch, so it fails first and the diff never gets printed.

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/felipeneuwald/stressy

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    # The codebase wraps errors — `fmt.Errorf("invalid %v: %w", …)` in
    # internal/cli/env.go, `errors.Is(ctx.Err(), context.DeadlineExceeded)` in
    # internal/stressy — and nothing above catches the two regressions that
    # pattern invites: a `%w` downgraded to `%v`, which compiles, prints
    # identically and silently breaks every errors.Is caller, and a direct `==`
    # against an error that is now wrapped. govet's printf analyser checks verb
    # validity, not wrapping.
    - errorlint
    # There is no //nolint in this repository today, which is the moment to
    # require that any future one names its linter and says why.
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      # fieldalignment optimises struct padding. Stressy allocates a handful of
      # structs for the lifetime of the process; ordering fields for the packer
      # instead of for the reader is a bad trade here.
      disable:
        - fieldalignment

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Without it a govet finding that shares a line with another linter's is
  # dropped — the only reason a separate `go vet` step ever existed.
  uniq-by-line: false

version: 2

# No `before: hooks: [go mod tidy]`. goreleaser's dirty-tree check runs several
# stages before the hooks do, so a tidy that rewrote go.mod mid-release could
# not fail the build — it just stamped the binary `v0.3.3+dirty` and shipped a
# dependency graph nobody reviewed. Tidiness is a CI check now (`go mod tidy
# -diff` in .github/workflows/ci.yml), where a drift is a red pull request
# rather than a silent mutation of the tree being released.

builds:
  - env:
      - CGO_ENABLED=0
    main: .
    # -trimpath keeps the builder's absolute paths out of the binary; without
    # it the same commit built on two machines produces two different
    # artefacts.
    flags:
      - -trimpath
    # `main.injected`, not `main.version`: the variable read by --version is
    # resolved from this one and from debug.ReadBuildInfo, so that binaries
    # built without ldflags — every `go install` and every `go build` — report
    # their version too (#40). The names have to agree, and a `-X` naming a
    # variable that does not exist is dropped silently rather than failing the
    # link, so TestLdflagsVariableMatchesGoreleaser checks this line against
    # version.go.
    ldflags:
      - -s -w -X main.injected={{.Version}}
    # The other half of a reproducible build: pin the artefact mtimes to the
    # commit rather than to whenever the release job happened to run.
    mod_timestamp: '{{ .CommitTimestamp }}'
    # The whole cross product, with no `ignore:` block. There used to be one,
    # excluding windows/arm64 — carried in with the first release config and
    # explained nowhere — while the README advertised six operating systems and
    # two architectures with no exception stated (#28). A Windows-on-ARM user
    # therefore found no binary, or ran the amd64 one under emulation, which for
    # a CPU stress tool means the numbers it exists to produce are meaningless.
    # Go cross-compiles the target fine at CGO_ENABLED=0; it costs one more
    # artefact per release. TestReleaseMatrixMatchesREADME reads these two lists
    # back and fails if they and the README stop agreeing.
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - netbsd
      - openbsd
    goarch:
      - amd64
      - arm64

archives:
  # `formats`, not the `format` singular deprecated in goreleaser v2.6. Every
  # target is a bare binary, so there is no per-OS override to make.
  - formats: [binary]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

# The `{{ if not .Prerelease }}` guards below keep the floating tags off
# pre-releases: tagging v0.4.0-rc1 would otherwise repoint
# ghcr.io/felipeneuwald/stressy:latest — the tag `docker run` resolves by
# default — at a release candidate. goreleaser skips an image or manifest whose
# template renders empty, so the versioned tags still publish as normal.
#
# goreleaser warns on every run that `dockers` and `docker_manifests` are being
# phased out in favour of `dockers_v2`, which folds both blocks into one
# multi-platform build. That migration is deliberately not part of this change:
# it rewrites the publishing path, and the publishing path is the one thing
# that cannot be rehearsed outside a real tag push. Worth its own issue.
dockers:
  - image_templates:
      - "ghcr.io/felipeneuwald/stressy:{{ .Version }}-amd64"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-amd64{{ end }}"
    use: buildx
    goarch: amd64
    goos: linux
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    dockerfile: Dockerfile
    # Staged into the build context for the Dockerfile's `COPY LICENSE`.
    extra_files:
      - LICENSE
  - image_templates:
      - "ghcr.io/felipeneuwald/stressy:{{ .Version }}-arm64"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-arm64{{ end }}"
    use: buildx
    goarch: arm64
    goos: linux
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    dockerfile: Dockerfile
    extra_files:
      - LICENSE

docker_manifests:
  - name_template: ghcr.io/felipeneuwald/stressy:{{ .Version }}
    image_templates:
      - ghcr.io/felipeneuwald/stressy:{{ .Version }}-amd64
      - ghcr.io/felipeneuwald/stressy:{{ .Version }}-arm64
  - name_template: "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest{{ end }}"
    image_templates:
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-amd64{{ end }}"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-arm64{{ end }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Publish to GitHub
release:
  github:
    owner: felipeneuwald
    name: stressy
  # Mark a tag carrying a semver pre-release suffix as a GitHub pre-release, so
  # it does not become the "Latest" release users land on. Pairs with the
  # `{{ if not .Prerelease }}` image guards above.
  prerelease: auto
  # `formats: binary` means there is no archive to carry the licence, so upload
  # it as its own release asset. MIT requires the text to accompany the copies
  # being redistributed, and these binaries are the copies.
  extra_files:
    - glob: LICENSE

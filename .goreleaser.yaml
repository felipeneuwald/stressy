version: 2

# No `before: hooks: [go mod tidy]`: it runs after the dirty-tree check, so it
# could only stamp the binary `+dirty`. `go mod tidy -diff` in CI covers it.

builds:
  - env:
      - CGO_ENABLED=0
    main: .
    # Without -trimpath the same commit builds differently on two machines.
    flags:
      - -trimpath
    # `main.injected`, not `main.version`; a `-X` naming a variable that does
    # not exist is dropped silently rather than failing the link, and the
    # binary then reports the build-info fallback. Renaming it here means
    # renaming `var injected string` in main.go, and nothing checks that (#40).
    ldflags:
      - -s -w -X main.injected={{.Version}}
    # Artefact mtimes from the commit, not from when the job ran.
    mod_timestamp: '{{ .CommitTimestamp }}'
    # The whole cross product, no `ignore:` block: an undocumented
    # windows/arm64 exclusion left those users emulating amd64, which for a CPU
    # stress tool makes the numbers meaningless (#28).
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  # An archive rather than the bare executable this used to publish: a macOS
  # download carries com.apple.quarantine, and Gatekeeper refuses to run it with
  # a dialog that offers no way out (#120). Extracting the binary out of an
  # archive is also what Homebrew, eget and asdf expect. The costs are that the
  # asset is no longer runnable as downloaded, and that every asset URL changes.
  # Notarisation is the real fix, and it needs an Apple Developer account.
  #
  # `formats`, not the `format` singular deprecated in goreleaser v2.6.
  - formats: [tar.gz]
    # zip on Windows: Explorer expands one on a double-click and cannot expand a
    # tar.gz, though Windows has shipped bsdtar as tar.exe since 10 1803.
    format_overrides:
      - goos: windows
        formats: [zip]
    # Named rather than left to goreleaser's default set, which is these two
    # plus CHANGELOG.md and would drop the licence silently if it ever changed.
    # This is what carries MIT now that the release has no `extra_files:`.
    #
    # Their mtimes come from the commit, as `mod_timestamp` does for the binary
    # above: a fresh checkout stamps both files with the time the job ran, and
    # an mtime inside a tarball is part of its bytes, so without this every
    # re-run of a tag publishes different archives and a different
    # checksums.txt. `.CommitDate`, not the `.CommitTimestamp` used above:
    # this field is parsed as RFC 3339 and the epoch form fails the build.
    files:
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: README.md
        info:
          mtime: '{{ .CommitDate }}'
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

# The `{{ if not .Prerelease }}` guards below are the only thing keeping an
# `-rc` tag off `:latest`; goreleaser skips a template that renders empty.
dockers:
  - image_templates:
      - "ghcr.io/felipeneuwald/stressy:{{ .Version }}-amd64"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-amd64{{ end }}"
    use: buildx
    goarch: amd64
    goos: linux
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    dockerfile: Dockerfile
    # Staged into the build context for the Dockerfile's `COPY LICENSE`.
    extra_files:
      - LICENSE
  - image_templates:
      - "ghcr.io/felipeneuwald/stressy:{{ .Version }}-arm64"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-arm64{{ end }}"
    use: buildx
    goarch: arm64
    goos: linux
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    dockerfile: Dockerfile
    extra_files:
      - LICENSE

docker_manifests:
  - name_template: ghcr.io/felipeneuwald/stressy:{{ .Version }}
    image_templates:
      - ghcr.io/felipeneuwald/stressy:{{ .Version }}-amd64
      - ghcr.io/felipeneuwald/stressy:{{ .Version }}-arm64
  - name_template: "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest{{ end }}"
    image_templates:
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-amd64{{ end }}"
      - "{{ if not .Prerelease }}ghcr.io/felipeneuwald/stressy:latest-arm64{{ end }}"

# The release notes are `git log {{ .Git.PreviousTag }}..{{ .Git.CurrentTag }}`,
# and goreleaser resolves the previous tag with `git describe --tags
# --abbrev=0 tags/<current>^`. An rc tag is a tag, so a `vX.Y.Z` tagged after
# a `vX.Y.Z-rcN` rehearsal takes the rc as its predecessor and publishes only
# the commits since it. v0.4.0 shipped that way: two commits in range, one
# `Merge pull request` and one `ci:`, both filtered below, so its page reads
# `## Changelog` and nothing else. The failure is silent — goreleaser exits 0
# and every artefact is correct, so the empty page is the only sign (#142).
#
# `ignore_tags` is the whole of the exclude list, and its entries reach
# `describe` as `--exclude=`, so they are globs rather than tag names. The
# rehearsal release keeps its own tag: only `describe` gets the globs, and the
# current-tag lookup matches this list literally, which no real tag does.
git:
  ignore_tags:
    - "*-rc*"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^refactor:'
      - Merge pull request
      - Merge branch

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Publish to GitHub
release:
  github:
    owner: felipeneuwald
    name: stressy
  # Keeps an rc tag off the "Latest" release, as the image guards do for :latest.
  prerelease: auto
  # No `extra_files:` for the licence: every archive above carries LICENSE, so a
  # loose copy beside them would be the same file published twice (#120).

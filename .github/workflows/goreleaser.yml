name: goreleaser

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Ref-less on purpose: two tags pushed close together both write the same
  # ghcr.io :latest manifest, and whichever finishes second wins. A release
  # must not interleave with another once the tag is public.
  #
  # Trade-off of cancel-in-progress: false — GitHub cancels a *pending* run
  # when a newer one queues, so three tags inside one release window will drop
  # the middle tag's release.
  group: release
  cancel-in-progress: false

# Read-only by default, so the gate below runs with a token that can publish
# nothing. The two write grants live on the one job that needs them (#68).
permissions:
  contents: read

jobs:
  # A `v*` tag used to go straight to publishing: tag a commit whose CI was
  # red, still running, or never ran at all — a tag on a branch that was never
  # pushed — and twelve binaries reached the release page and ghcr.io :latest
  # moved, with nothing having judged the code. The release dry run in ci.yml
  # exists precisely so release-path changes are validated before a tag, and
  # CONTRIBUTING's "Releasing" steps assume a green build; this is what
  # enforces the assumption. A repository ruleset would gate earlier, server
  # side, but it lives in repository settings — invisible in a clone and
  # unreviewable in a pull request. This is the in-repo version; a ruleset can
  # be layered on top.
  gate:
    name: Require green CI on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # This repository's workflow runs, and nothing else. Notably not
      # contents: this job checks out no code, so the shell it runs cannot be
      # one the tag brought with it.
      actions: read
    steps:
      - name: Check CI conclusions for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ci.yml's own runs, not the commit's check runs: this gate runs on
          # the tagged commit, so its check run is in that second list, forever
          # in_progress, and every release would deadlock on itself.
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '.workflow_runs[].id')

          # Load-bearing: with nothing to disagree with, every check below
          # passes vacuously, and a tag on a branch nobody pushed publishes.
          [ -n "$ids" ] || { echo "::error::CI never ran for ${GITHUB_SHA}"; exit 1; }

          # Every job of every run — not the run's conclusion, which is
          # `success` when a job is skipped as well as when it passes. Reading
          # the run alone would publish a commit whose Release dry run never
          # executed, which is the one job branch protection does not require
          # either. No job is named here: whatever ci.yml declares is what has
          # to be green, so a job added later is covered without editing this,
          # and a job that starts skipping blocks the release until someone
          # decides that was intended.
          while read -r id; do
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
              --jq '[.jobs[] | {name, status, conclusion}]')

            [ "$(jq length <<<"$jobs")" -gt 0 ] || { echo "::error::ci.yml run ${id} reports no jobs"; exit 1; }

            jq -e 'map(.status == "completed" and .conclusion == "success") | all' <<<"$jobs" >/dev/null || {
              echo "::error::CI is not green on ${GITHUB_SHA} (run ${id}):"
              jq -r '.[] | select(.status != "completed" or .conclusion != "success") | "  \(.name): \(.status)/\(.conclusion // "-")"' <<<"$jobs"
              exit 1
            }
          done <<<"$ids"

  goreleaser:
    name: Release
    # Nothing below this line runs until the gate passes. workflow_test.go
    # fails if this edge disappears (#68).
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # creates the release, uploads archives
      packages: write # pushes images and manifests to ghcr.io
    steps:
      # Pinned to commit SHAs for the reason ci.yml states at its first
      # `uses:`. These are the refs that matter most: they run with the two
      # write grants above (#65).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so the installed Go must
          # satisfy go.mod's directive by itself rather than re-execing a
          # downloaded one — a mismatch now fails loudly instead of quietly
          # shipping a different compiler than the logs claim, which is
          # exactly how #13 went unnoticed.
          go-version: stable
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release the tag that triggered this run, not whatever goreleaser
          # infers from the commit. Those differ whenever two tags share a
          # commit — which is exactly what a release-candidate flow produces:
          # tag vX.Y.Z-rc1, verify it, then tag vX.Y.Z on the same commit.
          # goreleaser then picked the rc, tried to re-publish an already
          # published release and failed on `already_exists` asset uploads,
          # having skipped the real release entirely. github.ref_name is
          # unambiguous: for a tag push it is the tag being pushed.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

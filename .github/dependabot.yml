version: 2

updates:
  # go.mod / go.sum, indirect dependencies included.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Majors are left out on purpose: a breaking bump should fail on its own.
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The `uses:` refs in .github/workflows/, and only those: a step's inputs —
  # the inlined go-version, the goreleaser `version:` — have no updater at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Grouped, and majors are the point: the refs are major tags, which float
    # through every minor, so a new major is all this updater has left to raise.
    groups:
      github-actions:
        patterns:
          - "*"
    # Matched by the anchored `^ci:` exclude in .goreleaser.yaml. Do not add
    # `include: scope`: `ci(deps):` no longer matches and the filter dies.
    commit-message:
      prefix: ci

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main-branch run; that result is the record for the commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned with the release in the trailing comment, which is what
      # dependabot rewrites; a version tag is a pointer its owner can move.
      # workflow_test.go fails on any external `uses:` that is not a SHA (#65).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # `stable`, not go-version-file: go.mod — see #13.
          go-version: stable
          check-latest: true
          # golangci-lint's module graph needs a cache key of its own, and this
          # file in the key invalidates it on the version bump below.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      # Through the module proxy, so sum.golang.org verifies it (#67).
      # Formatting first, or `run` fails on it with nothing actionable.
      - name: Check formatting
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 fmt --diff

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  # `go test` only ever ran on Linux, while signal delivery, timer behaviour and
  # CPU detection — what a stress tool lives on — differ per platform (#66).
  build:
    name: Build and test
    strategy:
      # Which platforms a regression reaches is the signal; do not cancel.
      fail-fast: false
      matrix:
        # The three hosted runners a release ships binaries for; FreeBSD has
        # none, so the dry run's cross-compile stays its ceiling.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      # The only thing keeping go.mod tidy since the goreleaser hook went (#23).
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      # Re-checks the restored cache against go.sum, which download-time does not.
      - name: Verify modules
        run: go mod verify

      # -race from day one, though it would not have caught #14's double close.
      - name: Test
        run: go test -race ./...

  # Its own job so a formatting nit cannot cost the CVE signal, and because
  # `main`'s branch protection requires a check of this name.
  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      # The nightly cron is gone: GitHub disables schedules after 60 days (#11).
      # This fires on change, so weekly dependabot PRs (#22) cover a quiet repo.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # goreleaser.yml only fires on a tag, so this is the only thing that validates
  # .goreleaser.yaml and the Dockerfile before they publish. No `paths:` filter.
  release-dryrun:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser increments the last tag, so a shallow clone gives it
          # nothing to work from. goreleaser.yml does the same.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      # `check` first, so a malformed config fails in a second rather than
      # after eight cross-compiles. Its dockers_v2 warning still exits 0.
      - name: Check release config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: check

      # --snapshot covers builds, archives, checksums and both images, but not
      # docker_manifests, the ghcr push or the release; an rcN tag reaches those.
      - name: Snapshot release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --snapshot --clean

version: "2"

# Owns formatting too, so CI has one Go gate. Run `fmt --diff` before `run`, or
# `run` fails on formatting first and the patch never gets printed.

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/felipeneuwald/stressy

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    # Catches a `%w` downgraded to `%v` and a direct `==` against a wrapped
    # error; govet's printf analyser checks verb validity, not wrapping.
    - errorlint
    # There is no //nolint here yet; any future one must name its linter.
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      # Padding is not worth reordering fields away from reading order here.
      disable:
        - fieldalignment

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Without it a govet finding sharing a line with another linter's is dropped.
  uniq-by-line: false

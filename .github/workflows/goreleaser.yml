name: goreleaser

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Ref-less: two tags close together write the same :latest manifest. The
  # trade-off is that GitHub drops a pending run when a newer one queues.
  group: release
  cancel-in-progress: false

# Read-only by default; the write grants live on the one job that needs them (#68).
permissions:
  contents: read

jobs:
  # A `v*` tag used to publish whatever it pointed at, red CI included. A
  # repository ruleset would gate earlier but is invisible in a clone; this is
  # the in-repo version, and a ruleset can be layered on top.
  gate:
    name: Require green CI on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Not contents: this job checks out no code, so the tag cannot supply it.
      actions: read
    steps:
      - name: Check CI conclusions for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ci.yml's runs, not the commit's check runs, which include this one.
          #
          # Push runs on main and nothing else: a pull-request run carries the
          # PR head as its head_sha, so an unfiltered query lets a tag on a
          # branch nobody reviewed or merged publish from it (#119). It also
          # keeps a pull-request run that shares the SHA — a fast-forward merge
          # leaves one — from having a say in whether a release goes out.
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "push" and .head_branch == "main") | .id')

          # Load-bearing: every check below passes vacuously on an empty list.
          # A commit that never reached main lands here, so the message says so.
          [ -n "$ids" ] || { echo "::error::ci.yml never ran for ${GITHUB_SHA} on a push to main"; exit 1; }

          # Every job, not the run conclusion, which reads `success` for a
          # skipped job too. No job is named, so ci.yml stays the only list.
          while read -r id; do
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
              --jq '[.jobs[] | {name, status, conclusion}]')

            [ "$(jq length <<<"$jobs")" -gt 0 ] || { echo "::error::ci.yml run ${id} reports no jobs"; exit 1; }

            jq -e 'map(.status == "completed" and .conclusion == "success") | all' <<<"$jobs" >/dev/null || {
              echo "::error::CI is not green on ${GITHUB_SHA} (run ${id}):"
              jq -r '.[] | select(.status != "completed" or .conclusion != "success") | "  \(.name): \(.status)/\(.conclusion // "-")"' <<<"$jobs"
              exit 1
            }
          done <<<"$ids"

  goreleaser:
    name: Release
    # Load-bearing, and nothing tests it: without this edge a `v*` tag publishes
    # whatever CI made of the commit, red or absent (#68).
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # creates the release, uploads archives
      packages: write # pushes images and manifests to ghcr.io
    steps:
      # Major tags, as in ci.yml — and unlike ci.yml's, these refs run with the
      # write grants above, so a moved tag reaches the release itself (#65).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so a version mismatch fails
          # loudly rather than shipping a compiler the logs do not name (#13).
          go-version: stable
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag that triggered this run, not what goreleaser infers: with
          # an rc1 and a final on one commit it picked the rc and re-published it.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

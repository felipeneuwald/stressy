name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main-branch run; that result is the record for the commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # `stable`, not go-version-file: go.mod — see #13.
          go-version: stable
          check-latest: true
          # go.sum alone: with golangci-lint at @latest there is no version in
          # this file for the key to track, so a lint release re-downloads its
          # module graph rather than being served a cache that predates it.
          cache-dependency-path: go.sum

      # Through the module proxy, so sum.golang.org verifies it (#67).
      # @latest, like govulncheck below: a `go run` argument is invisible to
      # both of dependabot's ecosystems, so a pinned version here is a pin
      # nothing updates. The cost is that a lint release can turn main red on a
      # day nobody changed any code, and on whoever pushes next.
      # Formatting first, or `run` fails on it with nothing actionable.
      - name: Check formatting
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest fmt --diff

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  # `go test` only ever ran on Linux, while signal delivery and timer behaviour
  # — what a stress tool lives on — differ per platform (#66).
  build:
    name: Build and test
    strategy:
      # Which platforms a regression reaches is the signal; do not cancel.
      fail-fast: false
      matrix:
        # The three hosted runners a release ships binaries for; FreeBSD has
        # none, so the dry run's cross-compile stays its ceiling.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The only thing keeping go.mod tidy since the goreleaser hook went (#23).
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      # Re-checks the restored cache against go.sum, which download-time does not.
      - name: Verify modules
        run: go mod verify

      # -race from day one, though it would not have caught #14's double close.
      - name: Test
        run: go test -race ./...

  # Its own job so a formatting nit cannot cost the CVE signal, and because
  # `main`'s branch protection requires a check of this name.
  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The nightly cron is gone: GitHub disables schedules after 60 days (#11).
      # This fires on change, so weekly dependabot PRs (#22) cover a quiet repo.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # goreleaser.yml only fires on a tag, so this is the only thing that validates
  # .goreleaser.yaml and the Dockerfile before they publish. No `paths:` filter.
  release-dryrun:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser increments the last tag, so a shallow clone gives it
          # nothing to work from. goreleaser.yml does the same.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      # `check` first, so a malformed config fails in a second rather than
      # after eight cross-compiles. Its dockers_v2 warning still exits 0.
      - name: Check release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      # --snapshot covers builds, archives, checksums and both images, but not
      # docker_manifests, the ghcr push or the release; an rcN tag reaches those.
      - name: Snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean

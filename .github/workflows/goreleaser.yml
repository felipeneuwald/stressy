name: goreleaser

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Ref-less on purpose: two tags pushed close together both write the same
  # ghcr.io :latest manifest, and whichever finishes second wins. A release
  # must not interleave with another once the tag is public.
  #
  # Trade-off of cancel-in-progress: false — GitHub cancels a *pending* run
  # when a newer one queues, so three tags inside one release window will drop
  # the middle tag's release.
  group: release
  cancel-in-progress: false

permissions:
  contents: write # goreleaser job: creates the release, uploads archives
  packages: write # goreleaser job: pushes images and manifests to ghcr.io

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load tool versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # From .github/versions.env. setup-go v6+ sets GOTOOLCHAIN=local, so
          # the installed Go must satisfy go.mod's directive by itself rather
          # than re-execing a downloaded one — a mismatch now fails loudly
          # instead of quietly shipping a different compiler than the logs
          # claim, which is exactly how #13 went unnoticed.
          go-version: ${{ steps.versions.outputs.go }}
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.versions.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

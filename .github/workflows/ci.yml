name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main-branch run; that result is the record for the commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # `stable`, not go-version-file: go.mod — see #13.
          go-version: stable
          check-latest: true
          # go.sum alone: with golangci-lint at @latest there is no version in
          # this file for the key to track, so a lint release re-downloads its
          # module graph rather than being served a cache that predates it.
          cache-dependency-path: go.sum

      # Through the module proxy, so sum.golang.org verifies it (#67).
      # @latest, like govulncheck below: a `go run` argument is invisible to
      # both of dependabot's ecosystems, so a pinned version here is a pin
      # nothing updates. The cost is that a lint release can turn main red on a
      # day nobody changed any code, and on whoever pushes next.
      # Formatting first, or `run` fails on it with nothing actionable.
      - name: Check formatting
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest fmt --diff

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  # `go test` only ever ran on Linux, while signal delivery and timer behaviour
  # — what a stress tool lives on — differ per platform (#66).
  build:
    name: Build and test
    strategy:
      # Which platforms a regression reaches is the signal; do not cancel.
      fail-fast: false
      matrix:
        # The three hosted runners a release ships binaries for; FreeBSD has
        # none, so the dry run's cross-compile stays its ceiling.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The only thing keeping go.mod tidy since the goreleaser hook went (#23).
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      # Re-checks the restored cache against go.sum, which download-time does not.
      - name: Verify modules
        run: go mod verify

      # -race from day one, though it would not have caught #14's double close.
      - name: Test
        run: go test -race ./...

  # One platform, not the matrix above: main_exit_test.go and
  # stressy_signal_test.go are `//go:build unix`, so a Windows run leaves them
  # out of the build, cannot reach main() at all, and measures a materially
  # lower figure for a reason that is not a regression (#108). ubuntu-latest is
  # the run that compiles every file.
  #
  # A job rather than two flags on `build`, for the reason govulncheck is one:
  # the matrix would measure the same thing three times and disagree, and a
  # second `go test` run buys a signal that stands on its own.
  #
  # Report only: nothing here compares the number to anything, so what turns
  # this job red is a failing test, not a figure. A threshold would trip on
  # ordinary changes rather than on regressions — deleting a test moves this
  # number as far as a regression does, and this repository deletes tests.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # For the badge push at the end, and scoped to this job rather than to the
      # workflow, where it would reach the other four as well (#68).
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # -coverpkg=./... is what makes this the merged figure rather than each
      # package's own: main_exit_test.go is `package main` and drives
      # internal/stressy through a re-execed main(), which without the flag
      # counts for nothing — 91.1% against 95.8%. The child's counters survive
      # os.Exit, so nothing here needs `go build -cover` or a GOCOVERDIR.
      # CONTRIBUTING.md publishes this command line, so a change here is a
      # change there.
      - name: Measure coverage
        id: cover
        run: |
          set -euo pipefail

          go test -race -coverpkg=./... -coverprofile=cover.out ./...

          total=$(go tool cover -func=cover.out | awk '$1 == "total:" { print $NF }')

          # Load-bearing: an empty total publishes a badge reading nothing and a
          # summary claiming nothing, both of them green.
          [ -n "$total" ] || { echo "::error::go tool cover printed no total line"; exit 1; }

          echo "total=${total}" >>"$GITHUB_OUTPUT"

          {
            echo "## Coverage: ${total}"
            echo
            echo 'Statements, merged across every package, measured on ubuntu-latest.'
            echo
            echo '<details><summary><code>go tool cover -func</code></summary>'
            echo
            echo '```'
            go tool cover -func=cover.out
            echo '```'
            echo
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"

      # The README badge's number, and the only thing the write grant is for.
      # img.shields.io renders whatever this file says, so no percentage is
      # written anywhere in the tree — which is what #62 was, CHANGELOG.md
      # claiming 97.3% where the measurement said 97.6%.
      #
      # One orphan commit, force-pushed: the branch is a file's current value
      # rather than a history, and a commit per merge would be noise in every
      # `git log --all`. It is not main, so branch protection is not in the way,
      # and this workflow's `push` trigger names main alone, so it cannot
      # trigger itself. On a pull request the step is skipped rather than
      # failed, which leaves the job green — goreleaser.yml's gate reads every
      # job's conclusion, and a skipped job would stop a release (#68).
      - name: Publish the coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          # README.md's badge URL names this branch and this file; renaming
          # either here without renaming it there leaves the badge showing the
          # last figure it was handed, for ever.
          BADGE_BRANCH: badges
          BADGE_FILE: coverage.json
          TOTAL: ${{ steps.cover.outputs.total }}
        run: |
          set -euo pipefail

          git switch --orphan "$BADGE_BRANCH"

          # Blue, like the three shields badges beside it: the number is a
          # report, and a colour scale is the threshold this deliberately lacks.
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"blue"}\n' "$TOTAL" >"$BADGE_FILE"

          git add -- "$BADGE_FILE"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "ci: coverage ${TOTAL} at ${GITHUB_SHA}"
          git push --force origin "$BADGE_BRANCH"

  # Its own job so a formatting nit cannot cost the CVE signal, and because
  # `main`'s branch protection requires a check of this name.
  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The nightly cron is gone: GitHub disables schedules after 60 days (#11).
      # This fires on change, so weekly dependabot PRs (#22) cover a quiet repo.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # goreleaser.yml only fires on a tag, so this is the only thing that validates
  # .goreleaser.yaml and the Dockerfile before they publish. No `paths:` filter.
  release-dryrun:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser increments the last tag, so a shallow clone gives it
          # nothing to work from. goreleaser.yml does the same.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      # `check` first, so a malformed config fails in a second rather than
      # after eight cross-compiles. Its dockers_v2 warning still exits 0.
      - name: Check release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      # --snapshot covers builds, archives, checksums and both images, but not
      # docker_manifests, the ghcr push or the release; an rcN tag reaches those.
      - name: Snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean

      # The only thing that starts what the step above built. Three of the
      # image's decisions are unobservable until something runs it — ENTRYPOINT,
      # the executable bit `COPY --chmod` sets, and a numeric USER with no
      # /etc/passwd behind it — and `FROM scratch` has no shell to repair any of
      # them from the inside, so until this step whoever pulled the tag was the
      # first to find out (#128).
      #
      # Both architectures: arm64 is half of what a release publishes, and it
      # runs under the QEMU registered above. `--platform` because the daemon
      # would otherwise refuse the foreign image rather than emulate it.
      #
      # dist/metadata.json carries the version goreleaser just used, so the tag
      # is read back rather than templated a second time here.
      - name: Run the images
        run: |
          set -euo pipefail

          # `// ""` rather than jq -e, whose non-zero exit would abort the step
          # under `set -e` before the message below could say what was wrong.
          version=$(jq -r '.version // ""' dist/metadata.json)

          # Load-bearing: an empty tag would run `stressy:-amd64` and fail on
          # something that reads as a broken workflow rather than a broken image.
          [ -n "$version" ] || { echo "::error::dist/metadata.json carries no version"; exit 1; }

          for arch in amd64 arm64; do
            echo "::group::linux/${arch}"
            docker run --rm --platform "linux/${arch}" \
              "ghcr.io/felipeneuwald/stressy:${version}-${arch}" -t 1s
            echo "::endgroup::"
          done
